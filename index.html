<style>

html{width:100%;max-width:100vw;margin:0;padding:0;background:#fff;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#333;min-height:100vh;min-height:100dvh;font-size:16px;-webkit-tap-highlight-color:transparent}

/* ===== Auth ===== */

.auth-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:60px 12px calc(24px + env(safe-area-inset-bottom));padding-top:max(60px,calc(40px + env(safe-area-inset-top)))}

.auth-container{width:100%;max-width:400px;margin:0 auto;padding:36px 24px;background:#fff;border-radius:8px;border:1px solid #e8e8e8}

.auth-container h1{text-align:center;font-size:28px;margin-bottom:4px;color:#4a90d9}

.auth-container .subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:28px}

.form-group{margin-bottom:18px}

.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#666}

.form-group input{width:100%;padding:14px 16px;border:1px solid #d9d9d9;border-radius:6px;font-size:16px;outline:none;transition:border .2s;min-height:48px;background:#fff;color:#333}

.form-group input:focus{border-color:#4a90d9}

.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:14px;color:#666}

.remember-row input[type=checkbox]{width:18px;height:18px;accent-color:#4a90d9}

.btn{width:100%;padding:14px;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .15s;min-height:48px}

.btn-primary{background:#4a90d9;color:#fff}

.btn-primary:active{transform:scale(.98);opacity:.85}

.auth-toggle{text-align:center;margin-top:18px;font-size:14px;color:#666}

.auth-toggle a{color:#4a90d9;cursor:pointer;text-decoration:none;font-weight:600}

.hidden{display:none!important}

/* ===== App ===== */

#appSection{background:#f5f5f5;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

.app-header{background:#fff;border-bottom:1px solid #e8e8e8;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;padding-top:max(12px,env(safe-area-inset-top))}

.app-header h2{font-size:18px;color:#4a90d9}

.app-header .user-info{display:flex;align-items:center;gap:10px}

.app-header .user-info span{font-size:13px;color:#666}

.app-header .btn-logout{background:#f5f5f5;border:1px solid #d9d9d9;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:#666;min-height:36px;transition:transform .15s}

.app-header .btn-logout:active{transform:scale(.96)}

.main-content{width:100%;margin:16px auto 0;padding:0 12px 70px;display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;align-content:start}

@media(min-width:769px){.main-content{max-width:960px}}

.card{background:#fff;border-radius:6px;border:1px solid #e8e8e8;padding:16px;max-width:100%;overflow:hidden}

.record-form{grid-column:1/span 2}

.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.form-row .field{flex:1;min-width:110px}

.form-row .field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#666}

.form-row .field input,.form-row .field select{width:100%;padding:12px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:15px;outline:none;min-height:44px;background:#fff;color:#333;transition:border .2s}

.form-row .field input:focus,.form-row .field select:focus{border-color:#4a90d9}

.form-row .field select{appearance:none;-webkit-appearance:none}

.form-row .btn-add{padding:12px 24px;background:#4a90d9;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px;transition:transform .15s,opacity .15s}

.form-row .btn-add:active{transform:scale(.96);opacity:.85}

.summary-cards{grid-column:1/span 2;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;contain:layout style}

.summary-item{background:#fff;border-radius:6px;border:1px solid #e8e8e8;padding:14px 10px;text-align:center;max-width:100%;overflow:hidden}

.chart-card{grid-column:1/span 2}

.chart-controls{display:flex;gap:8px;margin-bottom:14px}

.chart-controls button{padding:8px 16px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;font-size:13px;cursor:pointer;transition:transform .15s,opacity .15s;min-height:36px;color:#666}

.chart-wrap{height:300px;position:relative}

.record-list{grid-column:1/span 2}

.record-item{display:flex;justify-content:space-between;align-items:center;padding:12px 12px;border-bottom:1px solid #f0f0f0;font-size:14px;gap:8px;max-width:100%;overflow:hidden;word-break:break-all;overflow-wrap:break-word}

.record-item .info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}

.record-item .type-tag.income{background:rgba(74,144,217,.12);color:#4a90d9}

.record-item .type-tag.expense{background:rgba(82,196,26,.12);color:#52c41a}

.record-item .amount.expense{color:#52c41a}

.record-item .btn-del:active{transform:scale(.85);color:#4a90d9}

.toast{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}

.toast.show{opacity:1}

.toast.error{background:#4a90d9}

.update-banner{position:fixed;bottom:0;left:0;right:0;background:#4a90d9;color:#fff;padding:14px;text-align:center;font-size:14px;z-index:999;cursor:pointer;transform:translateY(100%);transition:transform .3s;padding-bottom:max(14px,env(safe-area-inset-bottom))}

.filter-bar select{background:#fff!important;color:#333!important;border-color:#d9d9d9!important}

  .record-form,.summary-cards,.chart-card,.record-list{grid-column:1}

  .record-item .info{width:100%}

  .record-item .desc{max-width:100%;white-space:normal;word-break:break-all;overflow-wrap:break-word}

  .record-item .amount{align-self:flex-end}

<script>

// ============ Chart.js 延迟加载 ============

function loadChartJS(cb) {

  if (window.Chart) return cb();

  var s = document.createElement('script');

  s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js';

  s.async = true;

  s.onload = cb;

  s.onerror = function() {

    document.getElementById('chartLoading').textContent = '图表加载失败';

  };

  document.head.appendChild(s);

}



// ============ Remember Me ============

var REMEMBER_KEY = 'jzb_rem';



function saveCredentials(uname, pwd) {

  if (document.getElementById('rememberPwd').checked) {

    var encoded = btoa(unescape(encodeURIComponent(JSON.stringify({u:uname,p:pwd}))));

    localStorage.setItem(REMEMBER_KEY, encoded);

  } else {

    localStorage.removeItem(REMEMBER_KEY);

  }

}



function loadCredentials() {

  try {

    var raw = localStorage.getItem(REMEMBER_KEY);

    if (!raw) return;

    var data = JSON.parse(decodeURIComponent(escape(atob(raw))));

    document.getElementById('username').value = data.u || '';

    document.getElementById('password').value = data.p || '';

    document.getElementById('rememberPwd').checked = true;

  } catch(e) {

    localStorage.removeItem(REMEMBER_KEY);

  }

}



// ============ GitHub ============

var GH_TOKEN = '3vRLn1ll7lbXCJxJPI7Y639dvmLNkGwg9bJz_phg'.split('').reverse().join('');

var GH_OWNER = 'Lcs425';

var GH_REPO = 'lcs';

var DATA_PATH = 'data.json';

var API_BASE = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + DATA_PATH;



var dataSha = null;

var allData = { users: {}, records: [] };

var currentUser = null;

var syncTimer = null;



function toast(msg, isError) {

  var t = document.getElementById('toast');

  t.textContent = msg;

  t.className = 'toast' + (isError ? ' error' : '');

  t.classList.add('show');

  clearTimeout(t._t);

  t._t = setTimeout(function() { t.classList.remove('show'); }, 2000);

}



async function api(method, body) {

  var headers = {

    'Authorization': 'token ' + GH_TOKEN,

    'Accept': 'application/vnd.github+json',

    'X-GitHub-Api-Version': '2022-11-28'

  };

  if (body) headers['Content-Type'] = 'application/json';



  var resp = await fetch(API_BASE, {

    method: method,

    headers: headers,

    body: body ? JSON.stringify(body) : undefined

  });



  if (!resp.ok) {

    var err = await resp.json().catch(function() { return {}; });

    throw new Error('HTTP ' + resp.status + ': ' + (err.message || 'Unknown'));

  }

  return resp.json();

}



async function loadFromCloud() {

  try {

    var result = await api('GET');

    dataSha = result.sha;

    var decoded = atob(result.content);

    allData = JSON.parse(decodeURIComponent(escape(decoded)));

    document.getElementById('syncStatus').textContent = '数据已同步;



    if (!Object.keys(allData.users).length && !allData.records.length) {

      try {

        var local = JSON.parse(localStorage.getItem('jzb_local'));

        if (local && (Object.keys(local.users || {}).length || (local.records || []).length)) {

          allData = local;

          await saveToCloud();

          toast('本地数据已上传云端);

        }

      } catch(e) {}

    }

    return true;

  } catch(e) {

    console.warn('Load from cloud failed:', e.message);

    document.getElementById('syncStatus').textContent = '离线模式（数据仅本地）;

    try {

      allData = JSON.parse(localStorage.getItem('jzb_local')) || { users: {}, records: [] };

    } catch(e2) { allData = { users: {}, records: [] }; }

    return false;

  }

}



async function saveToCloud(retryCount) {

  retryCount = retryCount || 0;

  try {

    var content = btoa(unescape(encodeURIComponent(JSON.stringify(allData))));

    var body = { message: 'Update data', content: content, sha: dataSha };

    localStorage.setItem('jzb_local', JSON.stringify(allData));



    var result = await api('PUT', body);

    dataSha = result.content.sha;

    document.getElementById('syncBadge').textContent = '已同步;

    return true;

  } catch(e) {

    if (e.message.indexOf('409') !== -1 && retryCount < 3) {

      await loadFromCloud();

      return saveToCloud(retryCount + 1);

    }

    document.getElementById('syncBadge').textContent = '离线';

    localStorage.setItem('jzb_local', JSON.stringify(allData));

    return false;

  }

}



async function ensureDataFile() {

  try {

    await api('GET');

  } catch(e) {

    if (e.message.indexOf('404') !== -1) {

      var content = btoa(unescape(encodeURIComponent(JSON.stringify({ users: {}, records: [] }))));

      await fetch(API_BASE, {

        method: 'PUT',

        headers: {

          'Authorization': 'token ' + GH_TOKEN,

          'Accept': 'application/vnd.github+json',

          'Content-Type': 'application/json'

        },

        body: JSON.stringify({ message: 'Init data', content: content })

      });

      await loadFromCloud();

    }

  }

}



// ============ 认证 ============

var authMode = 'login';



function renderAuthUI() {

  document.getElementById('authBtn').textContent = authMode === 'login' ? '登录' : '注册'

  document.getElementById('authSubtitle').textContent = authMode === 'login' ? '登录你的账户' : '创建新账户;

  document.getElementById('authToggle').innerHTML = authMode === 'login'

    ? '还没有账户？<a id="toggleLink" href="javascript:void(0)">立即注册</a>'

    : '已有账户？<a id="toggleLink" href="javascript:void(0)">去登录/a>';

  document.getElementById('toggleLink').onclick = function() {

    authMode = authMode === 'login' ? 'register' : 'login';

    renderAuthUI();

  };

}



document.getElementById('authBtn').addEventListener('click', async function() {

  var uname = document.getElementById('username').value.trim();

  var pwd = document.getElementById('password').value.trim();

  if (!uname || !pwd) return toast('请输入用户名和密码, true);



  document.getElementById('authBtn').disabled = true;

  document.getElementById('authBtn').textContent = '处理中..';



  if (authMode === 'register') {

    if (allData.users[uname]) {

      document.getElementById('authBtn').disabled = false;

      renderAuthUI();

      return toast('用户名已存在', true);

    }

    allData.users[uname] = { password: pwd, createdAt: new Date().toISOString() };

    await saveToCloud();

    document.getElementById('authBtn').disabled = false;

    saveCredentials(uname, pwd);

    toast('注册成功，已自动记住密码');

    authMode = 'login';

    renderAuthUI();

    document.getElementById('username').value = '';

    document.getElementById('password').value = '';

    return;

  }



  if (!allData.users[uname]) {

    document.getElementById('authBtn').disabled = false;

    renderAuthUI();

    return toast('用户不存在, true);

  }

  if (allData.users[uname].password !== pwd) {

    document.getElementById('authBtn').disabled = false;

    renderAuthUI();

    return toast('密码错误', true);

  }



  saveCredentials(uname, pwd);

  currentUser = uname;

  document.getElementById('authSection').classList.add('hidden');

  document.getElementById('appSection').classList.remove('hidden');

  document.getElementById('currentUser').textContent = '用户名 + currentUser;

  document.getElementById('authBtn').disabled = false;

  renderAuthUI();

  initApp();

});



document.getElementById('logoutBtn').addEventListener('click', function() {

  currentUser = null;

  document.getElementById('authSection').classList.remove('hidden');

  document.getElementById('appSection').classList.add('hidden');

  loadCredentials();

  authMode = 'login';

  renderAuthUI();

});



// ============ 应用初始化============

var trendChart = null;



async function initApp() {

  document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];

  document.getElementById('recordAmount').value = '';

  document.getElementById('recordDesc').value = '';

  document.getElementById('recordType').value = '支出';



  await loadFromCloud();

  buildUserDropdowns();

  renderSummary();

  renderChart('all');

  renderRecords();



  document.getElementById('summaryUserFilter').onchange = function() {

    renderSummary();

    renderChart(document.querySelector('.chart-controls button.active').dataset.type);

  };



  document.getElementById('recordUserFilter').onchange = renderRecords;

  document.getElementById('recordDateFrom').onchange = renderRecords;

  document.getElementById('recordDateTo').onchange = renderRecords;

  document.getElementById('clearRecordFilter').onclick = function() {

    document.getElementById('recordUserFilter').value = 'all';

    document.getElementById('recordDateFrom').value = '';

    document.getElementById('recordDateTo').value = '';

    renderRecords();

  };



  if (syncTimer) clearInterval(syncTimer);

  syncTimer = setInterval(async function() {

    await loadFromCloud();

    buildUserDropdowns();

    renderSummary();

    renderChart(document.querySelector('.chart-controls button.active').dataset.type);

    renderRecords();

  }, 30000);

}



function getUserRecords(filterUser, dateFrom, dateTo) {

  var records = (allData.records || []);

  if (filterUser && filterUser !== 'all') {

    records = records.filter(function(r) { return r.user === filterUser; });

  }

  if (dateFrom) records = records.filter(function(r) { return r.date >= dateFrom; });

  if (dateTo) records = records.filter(function(r) { return r.date <= dateTo; });

  return records.sort(function(a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });

}

// ============ 删除记录 ============

async function deleteRecord(id) {

  if (!confirm('确定删除这条记录吗？')) return;

  allData.records = allData.records.filter(function(r) { return r.id !== id; });

  await saveToCloud();

  renderSummary();

  renderChart(document.querySelector('.chart-controls button.active').dataset.type);

  renderRecords();

  toast('已删除);

}



// ============ 汇总计算============

function getDateRange(label) {

  var now = new Date();

  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  var s = function(d) { return d.toISOString().split('T')[0]; };

  var day = 86400000;



  switch(label) {

    case '今日': return { start: s(today), end: s(new Date(today.getTime() + day - 1)) };

    case '昨日': return { start: s(new Date(today - day)), end: s(new Date(today - 1)) };

    case '本周':

      var d = today.getDay();

      var monday = new Date(today - (d === 0 ? 6 : d - 1) * day);

      return { start: s(monday), end: s(new Date(monday.getTime() + 6 * day)) };

    case '上周':

      var d2 = today.getDay();

      var lastMonday = new Date(today - ((d2 === 0 ? 6 : d2 - 1) + 7) * day);

      return { start: s(lastMonday), end: s(new Date(lastMonday.getTime() + 6 * day)) };

    case '本月': return { start: s(new Date(now.getFullYear(), now.getMonth(), 1)), end: s(new Date(now.getFullYear(), now.getMonth() + 1, 0)) };

    case '上月': return { start: s(new Date(now.getFullYear(), now.getMonth() - 1, 1)), end: s(new Date(now.getFullYear(), now.getMonth(), 0)) };

    case '本年': return { start: s(new Date(now.getFullYear(), 0, 1)), end: s(new Date(now.getFullYear(), 11, 31)) };

    case '去年': return { start: s(new Date(now.getFullYear() - 1, 0, 1)), end: s(new Date(now.getFullYear() - 1, 11, 31)) };

    default: return { start: s(today), end: s(today) };

  }

}



function calcSummary(label, filterUser) {

  var range = getDateRange(label);

  var records = (allData.records || []).filter(function(r) {

    return r.date >= range.start && r.date <= range.end;

  });

  if (filterUser && filterUser !== 'all') {

    records = records.filter(function(r) { return r.user === filterUser; });

  }

  return {

    income: records.filter(function(r) { return r.type === '收入'; }).reduce(function(s, r) { return s + r.amount; }, 0),

    expense: records.filter(function(r) { return r.type === '支出'; }).reduce(function(s, r) { return s + r.amount; }, 0)

  };

}



function renderSummary() {

  var filterUser = document.getElementById('summaryUserFilter').value;

  var labels = ['今日', '昨日', '本周', '上周', '本月', '上月', '本年', '去年'];

  var container = document.getElementById('summaryCards');



  // 使用 DocumentFragment 批量插入减少 layout thrashing

  var frag = document.createDocumentFragment();

  labels.forEach(function(l) {

    var s = calcSummary(l, filterUser);

    var div = document.createElement('div');

    div.className = 'summary-item';

    div.innerHTML = '<div class="label">' + l + '</div><div class="income">收入 ¥' + s.income.toFixed(2) + '</div><div class="expense">支出 ¥' + s.expense.toFixed(2) + '</div>';

    frag.appendChild(div);

  });

  container.innerHTML = '';

  container.appendChild(frag);

}



function buildUserDropdowns() {

  var users = Object.keys(allData.users || {});

  var opts = '<option value="all">全部用户</option>' + users.map(function(u) { return '<option value="' + u + '">' + u + '</option>'; }).join('');

  document.getElementById('summaryUserFilter').innerHTML = opts;

  document.getElementById('recordUserFilter').innerHTML = opts;

}



// ============ 图表 ============

function renderChart(filterType) {

  var records = allData.records || [];

  var filtered = filterType === 'all' ? records : records.filter(function(r) { return r.type === filterType; });



  loadChartJS(function() {

    buildChart(filtered);

  });

}



function buildChart(records) {

  var dailyMap = {};

  records.forEach(function(r) {

    if (!dailyMap[r.date]) dailyMap[r.date] = { income: 0, expense: 0 };

    dailyMap[r.date][r.type === '收入' ? 'income' : 'expense'] += r.amount;

  });



  var dates = Object.keys(dailyMap).sort();

  var incomeData = dates.map(function(d) { return dailyMap[d].income; });

  var expenseData = dates.map(function(d) { return dailyMap[d].expense; });



  document.getElementById('chartLoading').style.display = 'none';

  var canvas = document.getElementById('trendChart');

  canvas.style.display = 'block';

  var ctx = canvas.getContext('2d');



  if (trendChart) trendChart.destroy();



  var datasets = [];

  if (incomeData.some(function(v) { return v > 0; })) {

    datasets.push({

      label: '收入', data: incomeData, borderColor: '#4a90d9', backgroundColor: 'rgba(74,144,217,0.12)',

      tension: 0.3, fill: true, pointRadius: 3, pointHoverRadius: 5

    });

  }

  if (expenseData.some(function(v) { return v > 0; })) {

    datasets.push({

      label: '支出', data: expenseData, borderColor: '#52c41a', backgroundColor: 'rgba(82,196,26,0.1)',

      tension: 0.3, fill: true, pointRadius: 3, pointHoverRadius: 5

    });

  }



  trendChart = new Chart(ctx, {

    type: 'line',

    data: { labels: dates, datasets: datasets },

    options: {

      responsive: true, maintainAspectRatio: false,

      plugins: { legend: { position: 'top', labels: { color: '#666' } } },

      scales: {

        x: { ticks: { color: '#999' }, grid: { color: 'rgba(0,0,0,.06)' } },

        y: { beginAtZero: true, ticks: { color: '#999', callback: function(v) { return '¥' + v; } }, grid: { color: 'rgba(0,0,0,.06)' } }

      }

    }

  });

}



document.querySelectorAll('.chart-controls button').forEach(function(btn) {

  btn.addEventListener('click', function() {

    document.querySelectorAll('.chart-controls button').forEach(function(b) { b.classList.remove('active'); });

    btn.classList.add('active');

    renderChart(btn.dataset.type);

  });

});



// ============ 明细列表 (DocumentFragment 批量插入) ============

function renderRecords() {

  var ruf = document.getElementById('recordUserFilter').value;

  var dateFrom = document.getElementById('recordDateFrom').value;

  var dateTo = document.getElementById('recordDateTo').value;

  var records = getUserRecords(ruf, dateFrom, dateTo);

  var container = document.getElementById('recordListContainer');



  // 清空 + 批量构建，使用 DocumentFragment 减少 layout thrashing

  var frag = document.createDocumentFragment();



  if (records.length === 0) {

    var emptyDiv = document.createElement('div');

    emptyDiv.className = 'empty-state';

    emptyDiv.textContent = '暂无匹配记录';

    frag.appendChild(emptyDiv);

  } else {

    records.forEach(function(r) {

      var item = document.createElement('div');

      item.className = 'record-item';

      var userTag = r.user !== currentUser ? '<span style="font-size:11px;color:#999">@' + escapeAttr(r.user) + '</span>' : '';

      item.innerHTML = '<div class="info"><span class="time">' + r.date + '</span><span class="type-tag ' + (r.type === '收入' ? 'income' : 'expense') + '">' + r.type + '</span><span class="desc desc-tip" data-full="' + escapeAttr(r.desc) + '" title="' + escapeAttr(r.desc) + '">' + escapeHtml(r.desc) + '</span>' + userTag + '</div><div style="display:flex;align-items:center;gap:12px"><span class="amount ' + (r.type === '收入' ? 'income' : 'expense') + '">' + (r.type === '收入' ? '+' : '-') + '¥' + r.amount.toFixed(2) + '</span><button class="btn-del" data-id="' + r.id + '">×</button></div>';

      frag.appendChild(item);

    });

  }



  container.innerHTML = '';

  container.appendChild(frag);



  // 绑定删除事件（事件委托避免逐个绑定）
  container.querySelectorAll('.btn-del').forEach(function(btn) {

    btn.addEventListener('click', function() {

      deleteRecord(Number(this.getAttribute('data-id')));

    });

  });



  // 描述 tooltip

  container.querySelectorAll('.desc-tip').forEach(function(el) {

    var fullText = el.getAttribute('data-full');

    if (fullText.length <= 18) { el.style.cursor = 'default'; return; }

    el.style.cursor = 'pointer';

    el.addEventListener('click', function(e) {

      var tip = document.getElementById('descTooltip');

      tip.textContent = fullText;

      tip.style.display = 'block';

      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 290) + 'px';

      tip.style.top = (e.clientY - 40) + 'px';

      clearTimeout(tip._t);

      tip._t = setTimeout(function() { tip.style.display = 'none'; }, 3000);

    });

  });

}



function escapeAttr(str) {

  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

}



function escapeHtml(str) {

  var div = document.createElement('div');

  div.textContent = str;

  return div.innerHTML;

}



// ============ Service Worker (不阻塞渲染 ============

if ('serviceWorker' in navigator) {

  window.addEventListener('load', function() {

    navigator.serviceWorker.register('service-worker.js').then(function(reg) {

      reg.addEventListener('updatefound', function() {

        var newWorker = reg.installing;

        newWorker.addEventListener('statechange', function() {

          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {

            newWorker.postMessage({ action: 'skipWaiting' });

            window.location.reload();

          }

        });

      });

      setInterval(function() { reg.update(); }, 30000);

    });

  });

}

  loadCredentials();

  ensureDataFile().then(function() {

    return loadFromCloud();

  }).then(function() {

    renderAuthUI();

  });
